name: WS65-C Source-Checked Editorial Evidence QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/lexicon/intake/ws65c-*'
      - 'tools/lexicon/ws65c_*'
      - 'tools/lexicon/test_ws65c_*'
      - 'docs/WS65C_*'
      - '.github/workflows/ws65c-source-evidence.yml'

permissions:
  contents: read

concurrency:
  group: ws65c-evidence-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  evidence-only-no-content-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate immutable recovery state and all old authoring catalog identities
        run: |
          python3 tools/lexicon/audit_recovery.py
          python3 tools/lexicon/validate.py --data-dir data/lexicon/authoring/en-v1
          python3 tools/lexicon/validate.py --data-dir data/lexicon/authoring/fall-v1
      - name: Regression tests WS63-WS65-C
        run: |
          python3 -m unittest discover -s tools/lexicon -p 'test_ws63_quality_audit.py' -v
          python3 -m unittest discover -s tools/lexicon -p 'test_ws64_woodland_review_queue.py' -v
          python3 -m unittest discover -s tools/lexicon -p 'test_ws65_specialist_review_audit.py' -v
          python3 -m unittest discover -s tools/lexicon -p 'test_ws65b_editorial_triage.py' -v
          python3 -m unittest discover -s tools/lexicon -p 'test_ws65c_source_evidence.py' -v
      - name: Recreate independent unsigned source-referenced evidence ledger
        run: |
          python3 tools/lexicon/ws65c_source_evidence.py --out-dir qa-ws65c-evidence
          python3 - <<'PY'
          from pathlib import Path
          import csv,json
          d=Path('qa-ws65c-evidence')
          report=json.loads((d/'source-evidence-receipt.json').read_text())
          with (d/'source-evidence-ledger.csv').open(newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==267 and report['full_source_rows']==267
          assert report['source_checked_spelling_senses']==38
          assert report['still_without_individual_evidence']==229
          assert report['new_qa_editor_signoffs']==0
          assert report['new_owner_public_approvals']==0
          assert report['new_playable_android_answers']==0
          assert all(not x['qa_editor_decision'] and not x['owner_decision'] for x in rows)
          print('WS65C_SOURCE_EVIDENCE_OK: 38 verified-sense context notes, 267 unchanged candidates, zero approvals')
          PY
          sha256sum qa-ws65c-evidence/source-evidence-ledger.csv qa-ws65c-evidence/source-evidence-receipt.json qa-ws65c-evidence/README.md > qa-ws65c-evidence/artifact-sha256.txt
      - name: Archive draft source evidence for editorial review
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-WS65C-Unsigned-Evidence-Ledger
          path: qa-ws65c-evidence/
          if-no-files-found: warn
          retention-days: 30
