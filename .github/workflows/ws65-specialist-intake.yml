name: WS65 Specialist Vocabulary Draft Intake QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/lexicon/intake/ws65-*'
      - 'docs/WS65_*'
      - 'tools/lexicon/ws65_*'
      - 'tools/lexicon/test_ws65_*'
      - '.github/workflows/ws65-specialist-intake.yml'

permissions:
  contents: read

concurrency:
  group: ws65-specialist-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-draft-without-activation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify historical recovered and authoring lexicon did not change
        run: |
          python3 tools/lexicon/audit_recovery.py
          python3 tools/lexicon/validate.py --data-dir data/lexicon/authoring/en-v1
          python3 tools/lexicon/validate.py --data-dir data/lexicon/authoring/fall-v1
      - name: Test WS63, WS64 and WS65 editorial/identity invariants
        run: |
          python3 -m unittest discover -s tools/lexicon -p 'test_ws63_quality_audit.py' -v
          python3 -m unittest discover -s tools/lexicon -p 'test_ws64_woodland_review_queue.py' -v
          python3 -m unittest discover -s tools/lexicon -p 'test_ws65_specialist_review_audit.py' -v
      - name: Build read-only source reconciliation and unsigned review artifact
        run: |
          python3 tools/lexicon/ws65_specialist_review_audit.py --out-dir qa-ws65-specialist
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('qa-ws65-specialist/editorial-receipt.json').read_text())
          assert r['candidate_rows']==145
          assert r['not_in_english_or_fall_catalog']==106
          assert r['new_owner_public_approvals']==0 and r['new_android_activated_words']==0
          print('WS65_UNSIGNED_INTAKE_OK')
          PY
          sha256sum qa-ws65-specialist/editorial-receipt.json qa-ws65-specialist/unsigned-candidate-review.csv qa-ws65-specialist/README.md > qa-ws65-specialist/artifact-sha256.txt
      - name: Save review-only evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-WS65-Unsigned-Specialist-Intake
          path: qa-ws65-specialist/
          if-no-files-found: warn
          retention-days: 30
