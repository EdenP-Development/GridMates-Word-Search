name: WS37 signed puzzle flow visual review
on:
  push:
    branches: [qa/ws37-puzzle-review-2026-11-17-b]
    paths:
      - .github/workflows/ws37-puzzle-review.yml
      - .github/scripts/ws37_puzzle_review.py
      - core/src/test/kotlin/com/playereden/gridmates/wordsearch/core/Ws37DailyTraceFixture.kt

permissions:
  contents: read
  actions: read

jobs:
  puzzle-review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Fetch signed v99 test APK
        uses: actions/download-artifact@v4
        with:
          name: GridMates-WordSearch-Android-QA
          run-id: 44142826177
          github-token: ${{ github.token }}
          path: qa-baseline
      - name: Fetch signed v100 test APK
        uses: actions/download-artifact@v4
        with:
          name: GridMates-WordSearch-Android-QA
          run-id: 44176136860
          github-token: ${{ github.token }}
          path: qa-candidate
      - name: Check signed APK digests
        run: |
          echo 'e3a05ddb1a1092dbe70b428582feb68fe5ec31dccd5784db7de8fa6da23f374a  qa-baseline/app-debug.apk' | sha256sum --check
          echo 'c5957595f5a84a3140a19f60dd71bf52b13936a77ff6c06ff3998db7e6a3e07a  qa-candidate/app-debug.apk' | sha256sum --check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare Daily touch paths from the exact-source puzzle generator
        run: gradle --no-daemon :core:test --tests '*.Ws37DailyTraceFixture'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=static_node"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install over v99 and exercise Solo and Daily on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 1536M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 .github/scripts/ws37_puzzle_review.py
      - name: Save layout evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-WS37-v100-Android-Visual-Review
          path: qa-phone-report/
          retention-days: 14
          if-no-files-found: warn
