name: WS32 My Puzzles Device QA

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - feature/ws32-illustrated-my-puzzles-2026-11-16
    paths:
      - '.github/workflows/ws32-my-puzzles-emulator.yml'

permissions:
  actions: read
  contents: read

jobs:
  verify-journal:
    name: Journal from v93 ${{ matrix.baseline }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - baseline: pr139
            run_id: 43963840406
            sha: 714ea448ee729140aa1cf689b11718bbed19ed8af4431a3b9b34c97e691faf41
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Retrieve the verified v93 upgrade test helpers
        uses: actions/checkout@v4
        with:
          ref: de3712d551a5acdedecc13ed9f2e78f24dad490c
          path: qa-harness
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Download the original v93 variant
        uses: actions/download-artifact@v4
        with:
          name: GridMates-WordSearch-Android-QA
          run-id: ${{ matrix.run_id }}
          github-token: ${{ github.token }}
          path: qa-archives/v93
      - name: Download the exact WS32 preview APK
        uses: actions/download-artifact@v4
        with:
          name: GridMates-WordSearch-Android-QA
          run-id: 43987637538
          github-token: ${{ github.token }}
          path: qa-archives/v94
      - name: Verify exact archived APKs
        env:
          BASELINE_SHA: ${{ matrix.sha }}
        run: |
          printf '%s  qa-archives/v93/app-debug.apk\n' "$BASELINE_SHA" | sha256sum --check
          printf '%s  qa-archives/v94/app-debug.apk\n' '0b8953e63a5c0cf38b127d76081c104e5c495ae443a0a827d6d0b3095870e539' | sha256sum --check
      - name: Enable emulator hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the journal and upgrade checks on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 .github/scripts/ws32_my_puzzles_emulator.py ${{ matrix.baseline }}
      - name: Archive the before and after screens
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WS32-My-Puzzles-screens-${{ matrix.baseline }}
          path: qa-report/*.png
          retention-days: 14
          if-no-files-found: ignore
