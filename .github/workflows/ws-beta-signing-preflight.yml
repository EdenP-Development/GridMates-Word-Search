name: Word Search beta signing and Android rehearsal

on:
  push:
    branches:
      - ci/word-search-beta-signing

permissions: {}

jobs:
  verify:
    if: ${{ github.repository_id == '1447522480' && github.ref == 'refs/heads/ci/word-search-beta-signing' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify Word Search beta certificate and signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.GRIDMATES_WORD_SEARCH_BETA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GRIDMATES_WORD_SEARCH_BETA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: gridmates-word-search-beta
          EXPECTED_CERT_SHA256: c29c0c593ac99ae81b5a5aaf5fca37bbed3bbd419e8f08287296de6681babba3
        run: |
          set -euo pipefail
          umask 077
          if [[ -z "${KEYSTORE_BASE64:-}" || -z "${KEYSTORE_PASSWORD:-}" ]]; then
            echo 'Word Search beta organization secrets are missing or unavailable to this repository.' >&2
            exit 1
          fi

          private_dir=$(mktemp -d)
          trap 'rm -rf -- "$private_dir"' EXIT
          keystore="$private_dir/word-search-beta.p12"
          certificate="$private_dir/certificate.der"
          proof="$private_dir/proof.csr"
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$keystore" 2>/dev/null; then
            echo 'Word Search beta keystore must be valid Base64.' >&2
            exit 1
          fi

          if ! keytool -exportcert -storetype PKCS12 -keystore "$keystore" \
            -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD -file "$certificate" >/dev/null 2>&1; then
            echo 'The dedicated beta keystore could not be opened with the configured password and alias.' >&2
            exit 1
          fi
          actual=$(sha256sum "$certificate")
          if [[ "${actual%% *}" != "$EXPECTED_CERT_SHA256" ]]; then
            echo 'Word Search beta certificate differs from the pinned fingerprint.' >&2
            exit 1
          fi

          if ! keytool -certreq -storetype PKCS12 -keystore "$keystore" \
            -alias "$KEY_ALIAS" -storepass:env KEYSTORE_PASSWORD -sigalg SHA256withRSA \
            -file "$proof" >/dev/null 2>&1; then
            echo 'The Word Search beta private key could not sign the verification request.' >&2
            exit 1
          fi
          verify_result=$(openssl req -in "$proof" -verify -noout 2>&1) || verify_result=
          openssl req -in "$proof" -noout -pubkey > "$private_dir/proof.pub"
          openssl x509 -inform DER -in "$certificate" -noout -pubkey > "$private_dir/certificate.pub"
          if [[ "$verify_result" != 'Certificate request self-signature verify OK' ]] || \
            ! cmp -s "$private_dir/proof.pub" "$private_dir/certificate.pub"; then
            echo 'The signed verification request did not match the pinned beta certificate.' >&2
            exit 1
          fi
          echo "Word Search beta signing key verified. Certificate SHA-256: $EXPECTED_CERT_SHA256"


  candidate:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout approved Woodland portraits
        uses: actions/checkout@v4
        with:
          repository: EdenP-Development/SudokuTogether
          ref: 975e31a1e8cbfebad1fbbc7602b3340c357da7ef
          path: _approved_sudoku
          persist-credentials: false
      - name: Checkout reviewed OFL fonts
        uses: actions/checkout@v4
        with:
          repository: google/fonts
          ref: 24ddc1f324cac5d9f5aedca126d298f56e3f1640
          path: _approved_fonts
          persist-credentials: false
          filter: blob:none
          sparse-checkout: |
            ofl/atkinsonhyperlegible
            ofl/ibmplexmono
            ofl/dmmono
            ofl/patrickhand
            ofl/literata
      - name: Verify and import shared release assets
        run: |
          python3 -m pip install --disable-pip-version-check --user fonttools==4.59.2 CairoSVG==2.8.2
          python3 scripts/import_woodland_portraits.py --source _approved_sudoku
          python3 scripts/import_font_library.py --source _approved_fonts
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Install pinned Gradle and Android build tools
        run: |
          bash tools/ci/install_pinned_gradle.sh
          sdkmanager_path="$(command -v sdkmanager || true)"
          if [ -z "$sdkmanager_path" ]; then
            sdkmanager_path="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$sdkmanager_path"
          "$sdkmanager_path" "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the release candidate and QA test APKs
        run: |
          gradle --no-daemon -PwordSearchBetaCandidate=true :core:test \
            :app:testDebugUnitTest :app:assembleRelease :app:assembleDebug :app:assembleDebugAndroidTest
      - name: Download and verify the actual signed QA v120 APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45491802328 --repo "$GITHUB_REPOSITORY" --name GridMates-WordSearch-Android-QA --dir qa-v120
          echo '0650e7fc6fb6198e22b20b8f6360c7379fe668a263b4eebb9d522f787b286a09  qa-v120/app-debug.apk' | sha256sum -c
      - name: Sign and verify the dedicated beta APK
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.GRIDMATES_WORD_SEARCH_BETA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.GRIDMATES_WORD_SEARCH_BETA_KEYSTORE_PASSWORD }}
          EXPECTED_CERT_SHA256: c29c0c593ac99ae81b5a5aaf5fca37bbed3bbd419e8f08287296de6681babba3
        run: |
          set -euo pipefail
          umask 077
          private_dir=$(mktemp -d)
          trap 'rm -rf -- "$private_dir"' EXIT
          test -n "$KEYSTORE_BASE64"
          test -n "$KEYSTORE_PASSWORD"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$private_dir/signer.p12"
          tools="$ANDROID_HOME/build-tools/35.0.0"
          mkdir -p beta-candidate beta-import-report
          apk=beta-candidate/GridMates-WordSearch-Beta1.apk
          "$tools/zipalign" -P 16 -f 4 app/build/outputs/apk/release/app-release-unsigned.apk "$private_dir/aligned.apk"
          "$tools/apksigner" sign --ks "$private_dir/signer.p12" --ks-type PKCS12 \
            --ks-key-alias gridmates-word-search-beta --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEYSTORE_PASSWORD --v4-signing-enabled false \
            --out "$apk" "$private_dir/aligned.apk"
          "$tools/zipalign" -c -P 16 4 "$apk"
          "$tools/apksigner" verify --print-certs "$apk" | tee beta-import-report/beta-signer.txt
          actual=$(sed -n 's/^Signer #[0-9]\+ certificate SHA-256 digest: //p' beta-import-report/beta-signer.txt)
          test "$actual" = "$EXPECTED_CERT_SHA256"
          "$tools/aapt" dump badging "$apk" | tee beta-import-report/beta-badging.txt
          grep -F "name='com.playereden.gridmates.wordsearch.beta' versionCode='121' versionName='0.9.75-beta.1'" \
            beta-import-report/beta-badging.txt
          if grep -Fxq application-debuggable beta-import-report/beta-badging.txt; then
            echo 'The beta APK must be non-debuggable.' >&2
            exit 1
          fi
          (cd beta-candidate && sha256sum GridMates-WordSearch-Beta1.apk) | tee beta-import-report/beta-sha256.txt
      - name: Check release isolation and enable emulator acceleration
        run: |
          python3 - <<'PY'
          from zipfile import ZipFile

          with ZipFile("qa-v120/app-debug.apk") as qa, ZipFile("beta-candidate/GridMates-WordSearch-Beta1.apk") as beta:
              preview_assets = {name for name in qa.namelist() if name.startswith("assets/ws")}
              assert len(preview_assets) > 100, "Wrong v120 fixture"
              assert not preview_assets.intersection(beta.namelist()), "QA assets entered the beta"
              assert not any(name.startswith("assets/ws") for name in beta.namelist())
              for name in beta.namelist():
                  if name.endswith(".dex"):
                      code = beta.read(name)
                      assert all(fragment not in code for fragment in (
                          b"Ws57WoodlandPreview", b"Ws66ChapterPreview", b"Ws73VarietyPreview"
                      )), "QA book content classes entered the beta"
              print(f"Confirmed exclusion of {len(preview_assets)} v120 preview assets and QA book classes.")
          PY
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Rehearse v120 Settings export and beta restore on Android 35
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          avd-name: word-search-beta-import
          ram-size: 3072M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: python3 scripts/ws_beta_import_emulator.py
      - name: Archive verification results
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-WordSearch-Beta1-Verification
          path: beta-import-report/
          retention-days: 14
      - name: Archive the verified beta candidate
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-WordSearch-Beta1-Android
          path: beta-candidate/GridMates-WordSearch-Beta1.apk
          if-no-files-found: error
          retention-days: 14
