name: WS40 Recovered Lexicon and Immutable Pack QA
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/lexicon/**'
      - 'tools/lexicon/**'
      - '.github/workflows/ws40-recovered-plans-lexicon.yml'
permissions:
  contents: read
concurrency:
  group: ws40-lexicon-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  recovered-lexicon:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify exact recovery and run authoring tests
        run: |
          python3 tools/lexicon/audit_recovery.py
          python3 -m unittest discover -s tools/lexicon -p 'test_*.py' -v
          python3 tools/lexicon/validate.py --json-out qa-lexicon-report/catalog-validation.json
      - name: Download and verify the existing pinned quarantine source
        run: |
          curl --fail --location --retry 2 --retry-delay 2 --connect-timeout 12 --max-time 90 \
            'https://github.com/en-wl/wordlist/releases/download/rel-2026.02.25/hunspell-en_US-2026.02.25.zip' \
            --output "$RUNNER_TEMP/esdb-en-us.zip"
          echo 'ac8e73310e951d88c52c2cf2ba54ceaca34f8486a81630ac8a75dc5f931179f9  '"$RUNNER_TEMP/esdb-en-us.zip" | sha256sum --check
          test "$(wc -c < "$RUNNER_TEMP/esdb-en-us.zip")" -eq 187271
      - name: Reproduce quarantine and the historic review queues
        run: |
          python3 tools/lexicon/import_esdb_quarantine.py \
            --archive "$RUNNER_TEMP/esdb-en-us.zip" --output-dir qa-lexicon-report/quarantine
          python3 tools/lexicon/prepare_theme_review.py \
            --quarantine qa-lexicon-report/quarantine/quarantine_candidates.csv \
            --output-dir qa-lexicon-report/review
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('qa-lexicon-report')
          intake = json.loads((root/'quarantine/intake_report.json').read_text())
          review = json.loads((root/'review/review_queue_report.json').read_text())
          catalog = json.loads((root/'catalog-validation.json').read_text())
          assert intake['candidate_unique_unreviewed'] == 36213
          assert review['topic_review_queues'] == {'woodland':185, 'space':183, 'garden':164}
          assert review['research_holds'] == 31
          assert review['priority_research_seed_theme_assignments'] == 563
          assert review['approved_unique_words'] == review['approved_topic_assignments'] == 0
          assert catalog['global_approved_playable_unique'] == 0
          print('PASS: exact source, 36,213 candidates, 532 review rows, 31 holds, 0 auto-approved.')
          PY
      - name: Confirm the draft data cannot become a playable snapshot
        run: |
          if python3 tools/lexicon/export_snapshot.py --pack-id en-woodland-v1 \
             --topics woodland --output-dir qa-lexicon-report/rejected-export; then
            echo 'ERROR: unreviewed source was exported'; exit 1
          fi
          test ! -e qa-lexicon-report/rejected-export
      - name: Save recovered editorial review sheets
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-WS40-Recovered-Lexicon-Review
          path: qa-lexicon-report/
          retention-days: 30
          if-no-files-found: error
