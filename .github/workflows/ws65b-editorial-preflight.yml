name: WS65-B Cross-Chapter Editorial Preflight QA

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/lexicon/intake/ws65b-*'
      - 'tools/lexicon/ws65b_*'
      - 'tools/lexicon/test_ws65b_*'
      - 'docs/WS65B_*'
      - '.github/workflows/ws65b-editorial-preflight.yml'

permissions:
  contents: read

concurrency:
  group: ws65b-preflight-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify-unsigned-review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate recovered lexicon and previous authoring editions
        run: |
          python3 tools/lexicon/audit_recovery.py
          python3 tools/lexicon/validate.py --data-dir data/lexicon/authoring/en-v1
          python3 tools/lexicon/validate.py --data-dir data/lexicon/authoring/fall-v1
      - name: Run existing and WS65-B editorial regression tests
        run: |
          python3 -m unittest discover -s tools/lexicon -p 'test_ws63_quality_audit.py' -v
          python3 -m unittest discover -s tools/lexicon -p 'test_ws64_woodland_review_queue.py' -v
          python3 -m unittest discover -s tools/lexicon -p 'test_ws65_specialist_review_audit.py' -v
          python3 -m unittest discover -s tools/lexicon -p 'test_ws65b_editorial_triage.py' -v
      - name: Produce source-pinned unsigned editorial and hold report
        run: |
          python3 tools/lexicon/ws65b_editorial_triage.py --out-dir qa-ws65b-editorial
          python3 - <<'PY'
          from pathlib import Path
          import csv,json
          d=Path('qa-ws65b-editorial')
          r=json.loads((d/'editorial-preflight-receipt.json').read_text())
          with (d/'unsigned-editorial-triage.csv').open(newline='') as f:
              rows=list(csv.DictReader(f))
          assert len(rows)==267 and r['total_rows']==267, r
          assert r['candidate_new_vs_en_and_fall_distinct_combined_not_approved']==200
          assert r['review_annotations']==133
          assert r['new_owner_public_approvals']==0 and r['new_qa_editor_approvals']==0
          assert all(not x['qa_editor_decision'] and not x['owner_decision'] for x in rows)
          print('WS65B_UNSIGNED_REVIEW_OK: 267 source rows; 133 preflight annotations; 0 signoffs')
          PY
          sha256sum qa-ws65b-editorial/editorial-preflight-receipt.json qa-ws65b-editorial/unsigned-editorial-triage.csv qa-ws65b-editorial/README.md > qa-ws65b-editorial/artifact-sha256.txt
      - name: Archive reproducible unsigned worksheet
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-WS65B-Unsigned-Editorial-Preflight
          path: qa-ws65b-editorial/
          if-no-files-found: warn
          retention-days: 30
