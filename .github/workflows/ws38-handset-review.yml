name: WS38 signed handset visual fixes review
on:
  push:
    branches: [qa/ws38-handset-review-2026-11-17]
    paths:
      - .github/workflows/ws38-handset-review.yml
      - .github/scripts/ws38_handset_review.py
      - core/src/test/kotlin/com/playereden/gridmates/wordsearch/core/Ws38GardenFixture.kt
permissions:
  contents: read
  actions: read
jobs:
  handset-review:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - name: Fetch signed v100 QA baseline
        uses: actions/download-artifact@v4
        with:
          name: GridMates-WordSearch-Android-QA
          run-id: 44176136860
          github-token: ${{ github.token }}
          path: qa-baseline
      - name: Fetch signed v101 QA candidate
        uses: actions/download-artifact@v4
        with:
          name: GridMates-WordSearch-Android-QA
          run-id: 44181424897
          github-token: ${{ github.token }}
          path: qa-candidate
      - name: Check APK digests
        run: |
          echo 'c5957595f5a84a3140a19f60dd71bf52b13936a77ff6c06ff3998db7e6a3e07a  qa-baseline/app-debug.apk' | sha256sum --check
          echo '2824444742e1b93129a8eb2d711075bd697c34065303b8e469e03f087f87853e  qa-candidate/app-debug.apk' | sha256sum --check
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Prepare generated Garden regression fixture
        run: gradle --no-daemon :core:test --tests '*.Ws38GardenFixture'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=static_node"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise handset screenshot fixes on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 1536M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 .github/scripts/ws38_handset_review.py
      - name: Save Android visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-WS38-v101-Handset-Visual-Review
          path: qa-phone-report/
          retention-days: 14
          if-no-files-found: warn
