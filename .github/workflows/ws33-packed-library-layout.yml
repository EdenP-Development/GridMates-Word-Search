name: WS33 v96 packed Library layout QA
on:
  push:
    branches: [qa/ws33-library-layout-2026-11-16]
    paths:
      - .github/workflows/ws33-packed-library-layout.yml
      - .github/scripts/ws33_packed_library_navigation.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  library-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the signed v96 APK from the independent build
        uses: actions/download-artifact@v4
        with:
          name: GridMates-WordSearch-Debug-ArtQA
          run-id: 44026675539
          github-token: ${{ github.token }}
          path: qa-baseline
      - name: Verify the exact v96 APK
        run: echo '9193cb92057d7fbb19a417dcac32ffcb3934c724cce39a5c23330c77526cbe13  qa-baseline/app-debug.apk' | sha256sum --check
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=static_node"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Open the catalog at 200% text and swipe to a second case
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_4
          ram-size: 1536M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: python3 .github/scripts/ws33_packed_library_navigation.py
      - name: Save layout checks and Android captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: GridMates-WS33-V96-Packed-Library-Layout
          path: qa-layout-report/
          retention-days: 3
          if-no-files-found: ignore
